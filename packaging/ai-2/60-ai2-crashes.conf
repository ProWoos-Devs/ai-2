# AI-2: record every crash (program name, signal, time; no core dump) so the
# desktop can say that something stopped unexpectedly and `ai-2 doctor` can
# say what to do. See /usr/lib/ai2/crash-handler. Loaded at boot by
# `sysctl --system` (Artix runit stage 1); `sudo sysctl --system` applies it now.
kernel.core_pattern = |/usr/lib/ai2/crash-handler %t %u %p %s %e %E
