# AI-2 LightDM greeter theming. Deployed to /etc/lightdm/lightdm-gtk-greeter.conf.
# Reliable over SSH (system config, no desktop session needed). Takes effect on
# the next greeter start (logout/reboot). Belongs in the ISO overlay too.
[greeter]
background = /usr/share/backgrounds/ai2/ai2-wallpaper.png
theme-name = Adwaita-dark
icon-theme-name = Adwaita
font-name = Sans 11
indicator-fixed-height = true
position = 50%,center 55%,center
