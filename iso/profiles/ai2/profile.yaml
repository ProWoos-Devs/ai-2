# AI-2 ISO profile (Light-tier desktop: XFCE on runit).
# Based on the artools xfce profile; AI-2 additions are marked.

live-session:
  user: ai-2
  password: ai-2
  autologin: true
  use-xlibre: false
  services:
    - acpid
    - bluetoothd
    - cronie
    # AI-2: no cupsd (printing is an optional install)
    - metalog
    # AI-2: NetworkManager, not connmand (xfce profile enables connmand but
    # never installs the connman daemon; networkmanager-runit is installed)
    - NetworkManager
    - lightdm
  user-services:
    - dbus
    - pipewire
    - pipewire-pulse
    - wireplumber
rootfs:
  packages:
    # AI-2: nm-applet instead of connman-gtk (see services note above)
    - network-manager-applet
    - epiphany
    - gnome-keyring
    - lightdm-gtk-greeter
    - pavucontrol
    - xfce4
    # AI-2: lean by design. Instead of xfce4-goodies (37 plugins, media players,
    # burner) only what the desktop actually uses; everything else is a pacman
    # install away. mousepad replaces leafpad (gtk2) and is the live text editor.
    - mousepad
    - xfce4-notifyd
    - xfce4-pulseaudio-plugin
    - xfce4-screenshooter
    - xfce4-taskmanager
    # AI-2: the graphical package manager (Artix's own package of Manjaro's
    # Add/Remove Software). Two packages and 4.5 MiB installed, because gtk4
    # and libadwaita already come with epiphany and the polkit agent
    # (polkit-gnome) with xfce4-session. Its update tray is hidden by the
    # ai-2 package's pacman hook; AI-2 does the notifying.
    - pamac
    # AI-2 additions (ai-2 + runtimes from the signed [ai2] repo, see
    # ../../pacman.conf.d/iso-x86_64.conf; buildiso needs -w)
    - ai2-keyring
    - ai-2
    - ai2-llama-cpp-baseline
    - ai2-llama-cpp-noavx
    - ai2-llama-cpp-avx2
    - python
    - python-yaml
    - zramen
    - earlyoom
    # AI-2: the proprietary Broadcom wl driver (BCM4311/4312/4322/43225, common
    # in 2008-2012 laptops) used to live in the live layer only, so WiFi that
    # worked on the stick vanished after install (review 2026-08-21).
    - broadcom-wl
  packages-init:
    dinit:
      - pipewire-dinit
      - pipewire-pulse-dinit
      - wireplumber-dinit
      - dinit-user-spawn
      - lightdm-dinit
      - metalog-dinit
      - networkmanager-dinit
    openrc:
      - pipewire-openrc
      - pipewire-pulse-openrc
      - wireplumber-openrc
      - lightdm-openrc
      - metalog-openrc
      - networkmanager-openrc
    runit:
      - lightdm-runit
      - metalog-runit
      - networkmanager-runit
      # AI-2 additions
      - zramen-runit
      - earlyoom-runit
    s6:
      - lightdm-s6
      - metalog-s6
      - networkmanager-s6
livefs:
  packages:
    - amd-ucode
    - artix-grub-live
    - calamares-extensions
    - gparted
    - intel-ucode
    - mkinitcpio-nfs-utils
    - nbd
    - squashfs-tools
  packages-init:
    dinit:
      - artix-live-dinit
    openrc:
      - artix-live-openrc
    runit:
      - artix-live-runit
    s6:
      - artix-live-s6
