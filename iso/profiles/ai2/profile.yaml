# AI-2 ISO profile (Light-tier desktop: XFCE on runit).
# Based on the artools xfce profile; AI-2 additions are marked.

live-session:
  user: ai-2
  password: ai-2
  autologin: true
  use-xlibre: false
  services:
    - acpid
    - bluetoothd
    - cronie
    - cupsd
    - metalog
    # AI-2: NetworkManager, not connmand (xfce profile enables connmand but
    # never installs the connman daemon; networkmanager-runit is installed)
    - NetworkManager
    - lightdm
  user-services:
    - dbus
    - pipewire
    - pipewire-pulse
    - wireplumber
rootfs:
  packages:
    - atril
    # AI-2: nm-applet instead of connman-gtk (see services note above)
    - network-manager-applet
    - epiphany
    - gnome-keyring
    - leafpad
    - lightdm-gtk-greeter
    - pavucontrol
    - xfce4
    - xfce4-goodies
    # AI-2 additions (ai-2 + runtimes from the signed [ai2] repo, see
    # ../../pacman.conf.d/iso-x86_64.conf; buildiso needs -w)
    - ai2-keyring
    - ai-2
    - ai2-llama-cpp-baseline
    - ai2-llama-cpp-noavx
    - ai2-llama-cpp-avx2
    - python
    - python-yaml
    - zramen
    - earlyoom
  packages-init:
    dinit:
      - pipewire-dinit
      - pipewire-pulse-dinit
      - wireplumber-dinit
      - dinit-user-spawn
      - lightdm-dinit
      - metalog-dinit
      - networkmanager-dinit
      - cups-dinit
    openrc:
      - pipewire-openrc
      - pipewire-pulse-openrc
      - wireplumber-openrc
      - lightdm-openrc
      - metalog-openrc
      - networkmanager-openrc
      - cups-openrc
    runit:
      - lightdm-runit
      - metalog-runit
      - networkmanager-runit
      - cups-runit
      # AI-2 additions
      - zramen-runit
      - earlyoom-runit
    s6:
      - lightdm-s6
      - metalog-s6
      - networkmanager-s6
      - cups-s6
livefs:
  packages:
    - amd-ucode
    - artix-docs
    - artix-grub-live
    - broadcom-wl
    - calamares-extensions
    - gparted
    - hexchat
    - intel-ucode
    - mkinitcpio-nfs-utils
    - nbd
    - squashfs-tools
    - virtualbox-guest-utils
  packages-init:
    dinit:
      - artix-live-dinit
    openrc:
      - artix-live-openrc
    runit:
      - artix-live-runit
    s6:
      - artix-live-s6
