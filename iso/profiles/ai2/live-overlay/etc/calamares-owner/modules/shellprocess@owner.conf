# AI-2: install for another owner. Runs INSIDE the target after the display
# manager is configured and the live network connections are copied (with no
# Users page, networkcfg restricts them to a user named "None"; the job opens
# them to everyone): a default hostname, a temporary account the login
# manager logs in by itself at the first boot into the owner setup session,
# where `ai-2 owner-setup` asks the owner's name and password (ai2/owner.py).
# The Users page is not in this sequence, so this is what sets the hostname.
---
dontChroot: false
timeout: 60
script:
    - "/usr/bin/ai-2 owner-setup --prepare"
