---
# AI-2: "Install for someone else" (ai2/owner.py). The offline sequence
# without the Users page: the owner setup job leaves the target asking for
# the owner's name and password at its first boot. stage-profile.sh copies
# the offline module configs beside this file; only settings.conf and
# shellprocess@owner.conf are ours. No postcfg: Artix's builds the home path
# from the Users page's name (TypeError without it), and on runit it has
# nothing to do (its user-services cover openrc and dinit only).
modules-search: [ local ]

# AI-2: initialize the target's pacman keyring and populate ALL shipped
# keyrings (artix + ai2), so pacman works on first boot and trusts [ai2].
# The offline rootfs ships no keyring and nothing else in the sequence
# creates one.
instances:
    - id: keyring
      module: shellprocess
      config: shellprocess@keyring.conf
    - id: label
      module: shellprocess
      config: shellprocess@label.conf
    - id: owner
      module: shellprocess
      config: shellprocess@owner.conf

sequence:
    - show:
        - welcomeq
        - locale
        - keyboard
        - partition
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - shellprocess@keyring
        - machineid
        - fstab
        - shellprocess@label
        - locale
        - keyboard
        - localecfg
        - luksopenswaphookcfg
        - luksbootkeyfile
        - initcpiocfg
        - initcpio
        - displaymanager
        - networkcfg
        - shellprocess@owner
        - hwclock
        - services-artix
        - grubcfg
        - bootloader
        - umount
    - show:
        - finished

branding: ai2

prompt-install: false

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: false

quit-at-end: false
