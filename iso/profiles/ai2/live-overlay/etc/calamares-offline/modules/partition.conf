# AI-2 copy of Artix's partition.conf (artools common live-overlay, Calamares
# 3.4). One change: initialSwapChoice is "small" instead of "suspend".
# "suspend" carves out a swap partition the size of RAM; on the 4 GB laptops
# with small disks AI-2 targets that costs 4 GB for a hibernate that rarely
# works on this hardware, while AI-2 sets up zram anyway. The other choices
# stay available in the installer.
---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    512MiB
    minimumSize:        256MiB
    label:              "EFI"
userSwapChoices:
    - none      # Create no swap, use no swap
    - small     # Up to 4GB
    - suspend   # At least main memory size
    - file      # To swap file instead of partition
swapPartitionName:      swap
luksGeneration: luks1
drawNestedPartitions:   true
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
initialSwapChoice: small
defaultPartitionTableType: msdos
requiredPartitionTableType:
    - msdos
    - gpt
defaultFileSystemType:  "ext4"
availableFileSystemTypes:  ["ext4","btrfs","f2fs","xfs"]
