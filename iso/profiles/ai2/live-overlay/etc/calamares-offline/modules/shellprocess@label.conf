# AI-2: label the freshly installed root filesystem "AI-2" (see
# /usr/share/ai2/label-root.sh on the live system). Runs OUTSIDE the target
# chroot, after the fstab module wrote the target's /etc/fstab; ${ROOT} is
# the target mount point (Calamares 3.4 syntax; the old @@ROOT@@ is passed
# through literally and the job silently does nothing, found 2026-08-19). No
# other "$" in the command line: shellprocess treats every $name as one of its
# variables and refuses the job.
---
dontChroot: true
timeout: 60
script:
    - "/usr/share/ai2/label-root.sh ${ROOT}"
