# AI-2: give the freshly installed root filesystem the label "AI-2", so
# partition views (a later reinstall, another OS, gparted) show a name instead
# of "sdaN". Runs in the target chroot after the fstab module wrote /etc/fstab.
# Only ext4/btrfs/xfs are labeled; anything else is left alone.
---
dontChroot: false
timeout: 60
script:
    - "sh -c 'set -e; src=$(awk '\"'\"'$2==\"/\" && $1!~/^#/ {print $1}'\"'\"' /etc/fstab | head -1); case \"$src\" in UUID=*) dev=/dev/disk/by-uuid/${src#UUID=};; /dev/*) dev=$src;; *) exit 0;; esac; fs=$(awk '\"'\"'$2==\"/\" && $1!~/^#/ {print $3}'\"'\"' /etc/fstab | head -1); case \"$fs\" in ext4|ext3|ext2) e2label \"$dev\" AI-2;; btrfs) btrfs filesystem label \"$dev\" AI-2 || true;; xfs) xfs_admin -L AI-2 \"$dev\" || true;; esac'"
