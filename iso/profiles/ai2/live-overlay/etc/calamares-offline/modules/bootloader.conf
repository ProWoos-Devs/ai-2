# AI-2 copy of Artix's bootloader.conf. One change: the UEFI boot entry is
# named "AI-2" instead of "Artix" (the BIOS path already takes the name from
# branding.desc bootloaderEntryName).
---
efiBootLoader: "grub"
kernel: "/vmlinuz-linux-x86_64"
img: "/initramfs-linux-x86_64.img"
fallback: "/initramfs-linux-x86_64-fallback.img"
timeout: "10"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
efiBootloaderId: "AI-2"
