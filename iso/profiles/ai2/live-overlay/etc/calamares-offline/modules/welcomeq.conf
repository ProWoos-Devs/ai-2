# AI-2: welcomeq (QML welcome page, branding/ai2/welcomeq.qml). Same checks
# as Artix's welcome.conf minus the internet check (this is the OFFLINE
# installer, a "no internet" warning would only confuse).
---
qmlSearch: both
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
requirements:
    requiredStorage:    5.5
    requiredRam:        1.0
    check:
        - storage
        - ram
        - power
        - root
        - screen
    required:
        - ram
geoip:
    style:    "none"
