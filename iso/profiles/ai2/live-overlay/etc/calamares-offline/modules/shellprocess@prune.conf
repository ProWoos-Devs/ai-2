---
# AI-2: remove the two CPU engine builds this machine cannot run (runs in the
# target chroot, after the pacman keyring exists so pacman -R works). The ISO
# carries baseline+noavx+avx2 for offline installs; only one is ever used.
dontChroot: false
timeout: 120
verbose: true
script:
    - command: "sh /usr/share/ai2/prune-engines.sh"
      timeout: 120
