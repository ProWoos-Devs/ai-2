---
# AI-2: create the installed system's pacman keyring. Runs in the target
# chroot after the rootfs is in place. `--populate` with no argument loads
# every keyring under /usr/share/pacman/keyrings (artix-keyring + ai2-keyring).
dontChroot: false
timeout: 600
verbose: true
script:
    - command: "pacman-key --init"
      timeout: 300
    - command: "pacman-key --populate"
      timeout: 300
