# AI-2: install the Broadcom wl WiFi driver into the target ONLY when this
# machine has a Broadcom WiFi device (see /usr/share/ai2/broadcom-install.sh
# on the live system). Runs OUTSIDE the chroot, after the target keyring
# exists (it chroots for pacman -U itself). ${ROOT} = target mount point;
# no other "$" on the command line (shellprocess rejects it).
---
dontChroot: true
timeout: 300
verbose: true
script:
    - "/usr/share/ai2/broadcom-install.sh ${ROOT}"
