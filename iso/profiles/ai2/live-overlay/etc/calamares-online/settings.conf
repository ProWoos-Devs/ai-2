---
modules-search: [ local ]

# AI-2: initialize the target's pacman keyring and populate ALL shipped
# keyrings (artix + ai2), so pacman works on first boot and trusts [ai2].
instances:
    - id: keyring
      module: shellprocess
      config: shellprocess@keyring.conf

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - packagechooser
        - netinstall
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - basestrap
        - shellprocess@keyring
        - machineid
        - packages
        - fstab
        - locale
        - keyboard
        - localecfg
        - luksopenswaphookcfg
        - luksbootkeyfile
        - initcpiocfg
        - initcpio
        - users
        - displaymanager
        - networkcfg
        - hwclock
        - services-artix
        - grubcfg
        - bootloader
        - postcfg
        - umount
    - show:
        - finished

branding: ai2

prompt-install: false

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: false

quit-at-end: false
