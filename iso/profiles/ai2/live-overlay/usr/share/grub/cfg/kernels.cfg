# AI-2: ONE boot entry, "Start AI-2", instead of Artix's two ("From CD/DVD/ISO"
# and "From Stick/HDD"), which in this artools version are identical (both
# @ro_opts@ and @rw_opts@ expand to nothing, same kernel, same initrd). The
# @kopts@/@ro_opts@ placeholders are filled by artools at build time.
if cpuid -l; then
    havekernel="Y"
    title=""
    for kopt in x86_64 $kopts @kopts@; do
        if [ -n "$title" ] ; then
            title="$title $kopt";
        else
            title="$kopt";
        fi;
    done
    menuentry "Start AI-2" --class=ai2 "$title @ro_opts@" {# set arguments above with the editor
        # AI-2: say what is happening; loading the kernel + initramfs from a
        # USB stick takes several seconds on old machines and the screen would
        # otherwise stay blank as if the computer had frozen.
        set color_normal=light-green/black
        echo ""
        echo "  Starting AI-2 ..."
        echo ""
        echo "  Loading the system from the stick. On an older computer this"
        echo "  takes a little while, the screen is not frozen."
        echo ""
        linux /boot/vmlinuz-$2
        initrd /boot/intel-ucode.img /boot/amd-ucode.img /boot/initramfs-x86_64.img
    }
    # AI-2 (2026-08-21): two more entries that cost nothing because the
    # initramfs already implements them. A bad USB write is the most common
    # beginner failure and shows up as random crashes; checksum=y verifies
    # the squashfs images against the shipped .md5 files first. nomodeset is
    # the classic way out of a black screen on old radeon/nouveau/i915 and was
    # only mentioned in the help text before.
    menuentry "Check this stick first, then start AI-2 (takes a few minutes)" --class=ai2 "$title @ro_opts@ checksum=y" {
        set color_normal=light-green/black
        echo ""
        echo "  Checking the files on the stick, then starting AI-2 ..."
        echo ""
        linux /boot/vmlinuz-$2
        initrd /boot/intel-ucode.img /boot/amd-ucode.img /boot/initramfs-x86_64.img
    }
    menuentry "Start AI-2 (safe graphics, if the screen stays black)" --class=ai2 "$title @ro_opts@ nomodeset" {
        set color_normal=light-green/black
        echo ""
        echo "  Starting AI-2 with basic graphics ..."
        echo ""
        linux /boot/vmlinuz-$2
        initrd /boot/intel-ucode.img /boot/amd-ucode.img /boot/initramfs-x86_64.img
    }
fi
if [ "${havekernel}" != "Y" ]; then
    menuentry --class=find.none "NO SUITABLE KERNELS AVAILABLE" {echo $@  echo "There are no kernels suitable for this machine available."
        echo ""
        if ! cpuid -l; then
            echo "This machine is NOT 64bit capable."
            for kk in /boot/vmlinu*x86_64; do
                if [ "$kk" != "/boot/vmlinu*x86_64" ]; then
                    have32="true"
                fi
            done
            if [ "${have32}" != "true" ]; then
                echo "There are no 32bit kernels available"
                echo "It appears you are trying to boot a 64bit release on a 32bit machine"
                echo "This cannot work!"
            fi
        fi
        echo "Press Escape to return to the main menu"
        sleep --interruptible 9999
        menu_reload
    }
fi
