<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -84 232 232" width="232" height="232" role="img" aria-label="AI-2">
  <!-- Calamares sidebar logo, WIDE variant, v2 (2026-08-25): Calamares renders
       productLogo into a SQUARE slot (the first wide-canvas version came out
       horizontally squeezed on RMM-PC). The banner artwork therefore sits on a
       square transparent canvas, centered vertically: the slot shows it at
       full width with breathing room above and below, no distortion. -->
  <defs>
    <style>.mono{font-family:"DejaVu Sans Mono","JetBrains Mono","Menlo",monospace;}</style>
  </defs>
  <rect x="1" y="1" width="198" height="62" rx="12" fill="#0B0F0D" stroke="#35D07F" stroke-width="2"/>
  <text x="18" y="42" class="mono" font-size="30" font-weight="700" fill="#35D07F" xml:space="preserve">&gt; AI-2 </text>
  <rect x="150" y="18" width="16" height="28" rx="2" fill="#35D07F"/>
</svg>
