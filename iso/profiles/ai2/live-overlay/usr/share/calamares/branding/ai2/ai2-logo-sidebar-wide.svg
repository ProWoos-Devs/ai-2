<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 212 76" width="212" height="76" role="img" aria-label="AI-2">
  <!-- Calamares sidebar logo, WIDE variant, v3 (2026-08-25): the QML sidebar
       (usr/share/calamares/qml/calamares-sidebar.qml) sizes this at 85% of
