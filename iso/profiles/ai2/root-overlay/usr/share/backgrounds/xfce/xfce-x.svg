<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="AI-2 wallpaper">
  <defs>
    <style>.mono{font-family:"DejaVu Sans Mono","JetBrains Mono","Menlo",monospace;}</style>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#0F1A14"/>
      <stop offset="100%" stop-color="#0B0F0D"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#35D07F" stroke-width="1" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- logo lockup, centered horizontally, upper-middle so desktop icons
       (left column) and the dock (bottom) stay clear of it -->
  <g transform="translate(580 230)">
    <rect x="0" y="0" width="760" height="176" rx="34" fill="none" stroke="#35D07F" stroke-width="7"/>
    <text x="56" y="122" class="mono" font-size="96" font-weight="700" fill="#35D07F" xml:space="preserve">&gt; AI-2 </text>
    <rect x="640" y="44" width="56" height="88" rx="5" fill="#35D07F">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <text x="380" y="266" class="mono" font-size="50" fill="#B8F5D0" text-anchor="middle">your old PC gets a new AI brain</text>
    <text x="380" y="322" class="mono" font-size="30" fill="#6B7A72" text-anchor="middle">Based on Artix Linux</text>
  </g>
</svg>
