# AI-2: steer GCN 1/2 era AMD GPUs (SI and CIK families, ~2012-2016 laptops
# and desktops) to the mature radeon driver. The amdgpu driver probe-crashes
# on them under kernel 7.1 (error -22 plus a WARN oops; found 2026-08-25 on
# an Acer ES1-522, Mullins Radeon R2, which blanked after GRUB). The same
# machine ran fine on radeon under Linux 6.12. Inert on machines without
# SI/CIK chips.
options amdgpu si_support=0 cik_support=0
options radeon si_support=1 cik_support=1
