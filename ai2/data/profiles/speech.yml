# Workflow profile, see translation.yml for the format. Speech to text from a
# FILE (a recording, a voice note, a video's audio) with whisper.cpp through
# `ai-2 transcribe`. Shape from the 2026-09-14 review, item 5: file
# transcription only, no live dictation, no voice assistant. The engine is
# the ai2-whisper-cpp package, one for every CPU (ai-2 transcribe names it
# when it is missing); ffmpeg from the Artix repositories converts the audio.
#
# The speech model per tier is what ai-2 transcribe downloads by default:
# base (about 388 MB in use) everywhere but the Tiny tier, which gets tiny.
# No star minimum, on purpose (review of this PR, 2026-09-15): the `voice`
# star comes from the chat model's generation speed and measures nothing
# about whisper, so a machine whose chat is slow must not be told speech is
# too slow. The honest gate is whisper-bench per 30-second window on the
# machine, a follow-up. No speed on the reference laptops has been measured.
id: speech
description: Turn a recording or a video's audio into text, offline
requests: [voice]
minimum: {}
remote: false
tiers:
  tiny:
    packages: [ffmpeg]
    speech_model: tiny
  light:
    packages: [ffmpeg]
    speech_model: base
  standard:
    packages: [ffmpeg]
    speech_model: base
usage:
  - "ai-2 transcribe recording.mp3      speech to text into recording.txt (language detected)"
  - "ai-2 transcribe note.ogg --lang es --model small     name the language, use the better model"
  - "sudo pacman -S ai2-whisper-cpp           the engine, one package for every CPU"
  - "Slow on an old CPU, the engine works in 30-second windows; leave it running."
