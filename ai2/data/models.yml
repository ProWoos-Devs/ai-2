# The universe of local models AI-2 knows about, smallest first.
# ram_peak_mb is the measured/estimated peak during load+inference (always
# above file_mb; load spikes and the KV cache add to it). The benchmark's AI
# Score gates which of these a given machine is steered to.
# Every repo/file here must be downloadable ANONYMOUSLY (no HF login, no gated
# license click): verified with a HEAD request 2026-08-19 (the official Qwen3
# repo only ships Q8_0, Google's Gemma repo is gated, hence the unsloth mirrors).
# ram_peak_mb for the 2026-08-21 additions is an estimate (file + ~400 MB).
# license is the model's own license (apache-2.0, gemma = Gemma Terms of Use).
# file_mb is the real Content-Length rounded up. sha256 is the Hugging Face LFS
# oid of the file (fetched from the HF API), checked after every download;
# verified is the date the URL, size and hash were last confirmed.
