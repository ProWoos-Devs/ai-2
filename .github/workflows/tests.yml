name: tests
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly: the catalog URL/size/hash check below
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q tests/
  # The packs' URLs, sizes and hashes, against the real files: weekly, and
  # whenever the packaged copy of the catalog changes (that is the commit that
  # can get them wrong).
  catalog:
    if: github.event_name == 'schedule' || github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the step below needs something to compare against
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      - id: changed
        if: github.event_name != 'schedule'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE"
          git cat-file -e "$base^{commit}" 2>/dev/null || base=$(git rev-parse HEAD^ 2>/dev/null || true)
          if [ -z "$base" ] || git diff --name-only "$base" HEAD | grep -q 'www/ai-2/ai2/data/packs.yml'; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi
      - if: github.event_name == 'schedule' || steps.changed.outputs.run == 'yes'
        run: AI2_NET_TESTS=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q tests/test_catalog_urls.py
