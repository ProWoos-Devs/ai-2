# Workflow profile format, Phase 0 reference example.
# A profile REQUESTS capabilities; the assigned tier GRANTS a subset; the
# runtime executes what was granted. Per-tier blocks may only narrow, never
# exceed, what the tier grants (CI will enforce this).
id: translation
description: Offline translation and OCR
requests: [translation, ocr]
tiers:
  tiny:
    packages: [argos-translate, tesseract]
    models:
      - {id: argos-en-es, file_mb: 120}
    llama_server: {ctx: 1024}
  light:
    packages: [argos-translate, tesseract]
    models:
      - {id: argos-en-es, file_mb: 120}
      # Catalog model: the id is the reference, sizes/quant live in models.yml.
      - {id: qwen3-1.7b}
    llama_server: {ctx: 2048}
