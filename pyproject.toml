[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai2"
version = "0.2.0"
description = "AI-2 automatically transforms compatible PCs into the best AI workstation that hardware can realistically support."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
ai-2 = "ai2.cli:main"
AI-2 = "ai2.cli:main"

[tool.setuptools.packages.find]
include = ["ai2*"]

[tool.setuptools.package-data]
ai2 = ["data/tiers/*.yml", "data/*.yml"]
